[project]
name = "pet-comic-backend"
version = "0.1.0"
description = "Local pet comic backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141,<1.0",
    "uvicorn[standard]>=0.53,<1.0",
    "pydantic>=2.13,<3.0",
    "pydantic-settings>=2.15,<3.0",
    "sqlalchemy>=2.0.54,<3.0",
    "alembic>=1.20,<2.0",
    "langgraph>=0.6,<0.7",
    "langchain-core>=0.3.86,<0.4",
    "langchain-openai>=0.3.35,<0.4",
    "openai>=1.109,<2.0",
    "pillow>=11.3,<12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
